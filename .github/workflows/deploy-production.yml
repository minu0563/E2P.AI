# 운영 배포 (https://e2pai.app). 자동으로 돌지 않는다:
#   Actions 탭 → "Deploy production" → Run workflow (cloudflare 브랜치) → production 환경 승인 → 배포
# 승인은 GitHub Settings → Environments → production → Required reviewers 에서 켠다 (system/docs/PRODUCTION.md)
# 순서: 설정 확인 → 테스트 → 빌드 → 크기 검사 → 운영 DB 마이그레이션 → 배포 → 스모크 테스트
name: Deploy production

on:
  workflow_dispatch:

permissions:
  contents: read

# 운영에 동시에 두 번 배포하지 않는다
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Required reviewers가 켜져 있으면 여기서 승인을 기다린다. 운영 비밀값은 이 환경에만 둔다
    environment:
      name: production
      url: https://e2pai.app

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      TERMS_VERSION: ci

    steps:
      # 운영은 cloudflare 브랜치에서만 배포한다 (다른 브랜치를 실수로 고르지 않게)
      - name: Check branch
        run: |
          if [ "$GITHUB_REF_NAME" != "cloudflare" ]; then echo "운영 배포는 cloudflare 브랜치에서만 합니다 (지금: $GITHUB_REF_NAME)"; exit 1; fi

      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/checkout@v4
        with:
          repository: minu0563/E2P.AI.SYSTEM
          ref: ${{ github.ref_name }}
          token: ${{ secrets.SYSTEM_REPO_TOKEN }}
          path: system
          persist-credentials: false

      # wrangler.jsonc 운영 설정에 아직 채우지 않은 값(TODO_PROD_)이 있으면 멈춘다
      - name: Check production config
        run: |
          if grep -n "TODO_PROD_" wrangler.jsonc; then echo "wrangler.jsonc 운영 설정에 채우지 않은 값이 있습니다"; exit 1; fi
          if [ -z "$PROD_DB" ]; then echo "PRODUCTION_DATABASE_URL secret이 없습니다"; exit 1; fi
        env:
          PROD_DB: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy

      - name: Lint · typecheck · test
        run: |
          npx eslint .
          npx next typegen
          npx tsc --noEmit
          npx vitest run

      - name: Build (OpenNext)
        run: npx opennextjs-cloudflare build -e production

      - name: Bundle size check
        run: node scripts/check-bundle-size.mjs production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 운영 DB 마이그레이션. 배포 직전에 하고, 실패하면 배포하지 않는다.
      # Neon 직접 연결 주소(pooler 아님). 스키마 변경 전에는 Neon에서 브랜치(백업)를 먼저 만든다
      - name: Migrate production DB
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}

      - name: Deploy to production
        run: npx wrangler deploy --config wrangler.jsonc -e production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # 배포 직후 기본 동작 확인 (생성·로그인은 하지 않음 — AI 비용·계정 영향 없음)
      - name: Smoke test
        run: node scripts/smoke-test.mjs https://e2pai.app
