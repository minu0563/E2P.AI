services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: prompt_app
      POSTGRES_PASSWORD: prompt_app
      POSTGRES_DB: prompt_app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    ports:
      - "6379:6379"
volumes:
  pgdata:
